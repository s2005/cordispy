name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --frozen fails the build if uv.lock has drifted from pyproject.toml,
      # rather than silently resolving something else than a contributor gets.
      - run: uv sync --all-extras --frozen

      - run: uv run pytest -q

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # The minimum supported version, matching tool.mypy.python_version.
          python-version: "3.11"

      - run: uv sync --all-extras --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy src/cordispy
