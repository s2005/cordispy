name: Publish

# Tagging `v0.0.1` publishes version 0.0.1 to PyPI. Run the workflow by hand
# (workflow_dispatch) to build and check the artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.11"
          version: "0.11.14"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project.version ${version}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} is not contained in main" >&2
            exit 1
          fi

      - run: uv sync --all-extras --group release --frozen

      - run: uv run --frozen pytest -q

      - run: uv run --frozen ruff check .

      - run: uv run --frozen ruff format --check .

      - run: uv run --frozen mypy src/cordispy

      - run: uv build --build-constraint build-constraints.txt --require-hashes

      - name: Check package metadata
        run: uv run --frozen --group release twine check --strict dist/*

      - name: Check package contents
        run: uv run --frozen python scripts/verify_artifacts.py --dist-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: distributions
          path: dist/
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cordispy
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist/
